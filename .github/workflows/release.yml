name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install nuitka ordered-set zstandard

      - name: Run tests
        run: python -m pytest tests/ -q

      # Attached to the release alongside the exe, so a pack can grow with its
      # template set without every image landing in the repo's history twice.
      # Builds from packs/<name>/templates — the user's own ./templates is
      # git-ignored, so a CI checkout has nothing else to build from.
      - name: Build the downloadable packs
        run: |
          $ErrorActionPreference = 'Stop'
          $built = 0
          foreach ($dir in Get-ChildItem packs -Directory) {
            if (-not @(Get-ChildItem $dir.FullName -Filter *.macro.json).Count) { continue }
            python tools/build_pack.py $dir.Name --out-dir packs-dist
            $code = $LASTEXITCODE
            # 3 means that pack's images have not been captured yet. Not a broken
            # build — it just has nothing worth downloading. Anything else non-zero is
            # a real failure and must stop the release.
            if ($code -eq 3) { Write-Host "skipping $($dir.Name): no templates"; continue }
            if ($code -ne 0) { throw "pack build failed for $($dir.Name) (exit $code)" }
            $built++
          }
          if ($built -eq 0) { throw "no packs were built" }
          Write-Host "built $built pack(s)"
          # Explicit, because GitHub ends a pwsh step with `exit $LASTEXITCODE` — a
          # skipped pack leaves 3 there and would fail the release on success.
          exit 0

      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --zig --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=engine `
            --include-package=gui `
            --include-module=win32gui `
            --include-module=win32api `
            --include-module=win32con `
            --include-module=pywintypes `
            --include-data-dir=packs=packs `
            --output-dir=. `
            --output-filename=Macroscope.exe `
            --assume-yes-for-downloads `
            main.py

      - name: Package release zip
        run: Compress-Archive -Path main.dist\* -DestinationPath Macroscope-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Macroscope-${{ github.ref_name }}.zip
            packs-dist/*.wmbpack
          generate_release_notes: true
